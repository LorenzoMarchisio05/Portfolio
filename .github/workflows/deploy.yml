name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a deploy still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Pages project is Direct Upload, so it is deployed from here rather
      # than by Cloudflare's Git integration. RESEND_API_KEY lives on the Pages
      # project, not in this repo.
      - run: npx wrangler pages deploy --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
